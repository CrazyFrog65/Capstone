<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Image Detection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Title Section -->
        <header>
            <h1>Fake Image Detector</h1>
            <p class="info">
                CAPSTONE PROJECT
                
            </p>
        </header>

        <!-- Input Section -->
        <form class="form" id="predict-form">
            <label for="image-url">Enter Image URL:</label>
            <input id="image-url" type="text" placeholder="Paste image URL here">

            <label for="image-file">Or Upload Image:</label>
            <input id="image-file" type="file" accept="image/*">

            <button id="predict-btn" type="submit">Submit</button>
        </form>

        <!-- Preview (updates when user types a URL or selects a file) -->
        <div id="preview-area" style="display:none; margin-top:12px;">
            <h3 style="margin-bottom:8px;">Preview</h3>
            <div class="image-wrapper" style="padding:8px; background:#fff; border-radius:8px; border:1px solid #e6e6e6;">
                <img id="preview-image" src="" alt="Preview" style="max-width:100%; border-radius:6px; object-fit:contain;" />
            </div>
        </div>

        <!-- Result area -->
            <div id="result" class="result" style="display:none;">
            <div class="result-left">
                <h3>Prediction</h3>
                <p><strong>Class:</strong> <span id="pred-class">-</span></p>
                <p><strong>Confidence:</strong> <span id="pred-confidence">-</span></p>
                <p><strong>Breakdown:</strong></p>
                <ul id="pred-probs"></ul>
            </div>
            <div class="result-right">
                <h3>Original Image</h3>
                <img id="original-image" src="" alt="Original" style="max-width:100%; border-radius:8px;" />
            </div>
            <div style="clear:both"></div>
            <div id="reverse-results" style="display:none; margin-top:12px;">
                <h3>Reverse Search Results</h3>
                <div id="reverse-grid" class="reverse-grid"></div>
                <p id="reverse-status"></p>
                <p id="reverse-source" style="font-size:12px; color:#333; margin-top:6px;"></p>
            </div>
        </div>
        <div style="text-align:center; font-size:12px; color:#666; margin-top:12px;">Results open in a new page. Use <strong>Submit another</strong> on the results page to test again.</div>

    </div>

</body>
    <script>
        const form = document.getElementById('predict-form');
        const fileInput = document.getElementById('image-file');
        const urlInput = document.getElementById('image-url');
        const previewImage = document.getElementById('preview-image');
        const previewArea = document.getElementById('preview-area');
        const resultDiv = document.getElementById('result');
        const predClass = document.getElementById('pred-class');
        const predConf = document.getElementById('pred-confidence');
        const predProbs = document.getElementById('pred-probs');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            resultDiv.style.display = 'none';
                document.getElementById('reverse-results').style.display = 'none';
                document.getElementById('reverse-grid').innerHTML = '';
                document.getElementById('original-image').src = '';
                document.getElementById('reverse-status').innerText = '';

            // If a file is selected, do file upload; otherwise try URL
            if (fileInput.files && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const formData = new FormData();
                formData.append('image', file);

                try {
                    const resp = await fetch('http://127.0.0.1:5000/predict', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await resp.json();
                        if (resp.ok) {
                            // Save result into session storage and navigate to results page
                            data.input_url = urlInput.value || null;
                            sessionStorage.setItem('lastPrediction', JSON.stringify(data));
                            window.location.href = 'results.html';
                    } else {
                        alert(data.error || 'Prediction failed');
                    }
                } catch (err) {
                    alert('Network error: ' + err.message);
                }

            } else if (urlInput.value) {
                try {
                    const resp = await fetch('http://127.0.0.1:5000/predict', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: urlInput.value })
                    });
                    const data = await resp.json();
                    if (resp.ok) {
                        data.input_url = null;
                        sessionStorage.setItem('lastPrediction', JSON.stringify(data));
                        window.location.href = 'results.html';
                    } else {
                        alert(data.error || 'Prediction failed');
                    }
                } catch (err) {
                    alert('Network error: ' + err.message);
                }
            } else {
                alert('Please upload an image or specify a URL');
            }
        });

        // Helper to show/hide preview
        function showPreview(src) {
            if (!src) {
                previewArea.style.display = 'none';
                previewImage.src = '';
                return;
            }
            previewImage.src = src;
            previewArea.style.display = 'block';
        }

        function clearPreview() {
            previewImage.src = '';
            previewArea.style.display = 'none';
        }

        // When user selects a local file, show a preview and clear URL field
        fileInput.addEventListener('change', (e) => {
            if (fileInput.files && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                // Only preview image files
                if (!file.type.startsWith('image/')) {
                    clearPreview();
                    return;
                }

                // Use an object URL for faster preview
                const url = URL.createObjectURL(file);
                showPreview(url);
                // Revoke object URL once the preview has loaded to free memory
                previewImage.onload = () => { try { URL.revokeObjectURL(url); } catch (err) {} };
                // clear the url text input so it's clear the file is used
                urlInput.value = '';
            } else {
                clearPreview();
            }
        });

        // When user types a URL, show a preview and clear file input selection
        urlInput.addEventListener('input', (e) => {
            const val = urlInput.value.trim();
            if (val) {
                // Clear selected file
                if (fileInput.value) {
                    fileInput.value = '';
                }
                showPreview(val);
            } else {
                clearPreview();
            }
        });

        // If preview image fails to load, hide preview
        previewImage.addEventListener('error', () => {
            // Keep preview hidden for broken links
            previewImage.src = '';
            previewArea.style.display = 'none';
        });


        function showResult(data) {
                predClass.innerText = data.class || '-';
                predConf.innerText = (typeof data.confidence !== 'undefined') ? data.confidence + '%' : '-';
                predProbs.innerHTML = '';
                if (data.probabilities) {
                    for (const [k,v] of Object.entries(data.probabilities)) {
                        const li = document.createElement('li');
                        li.innerText = `${k}: ${v}%`;
                        predProbs.appendChild(li);
                    }
                }

                // Show original image
                if (data.original_image) {
                    const imgEl = document.getElementById('original-image');
                    imgEl.src = data.original_image;
                }

                // Reverse search results (only present for 'real' predictions)
                if (data.reverse_results && data.reverse_results.length > 0) {
                    const container = document.getElementById('reverse-grid');
                    container.innerHTML = '';
                    data.reverse_results.forEach(r => {
                        const a = document.createElement('a');
                        a.href = r.link || '#';
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.className = 'reverse-item';

                        const img = document.createElement('img');
                        img.alt = r.title || 'result';
                        img.src = r.thumbnail || r.link || '';
                        img.loading = 'lazy';
                        img.onerror = function() { this.style.display='none'; };
                        a.appendChild(img);

                        const span = document.createElement('span');
                        span.innerText = r.title || r.link || '';
                        span.className = 'reverse-title';
                        a.appendChild(span);

                        container.appendChild(a);
                    });
                    document.getElementById('reverse-status').innerText = `Found ${data.reverse_results.length} match(es)`;
                    if (data.reverse_source_url) {
                        const srcEl = document.getElementById('reverse-source');
                        srcEl.innerHTML = `Search source: <a href="${data.reverse_source_url}" target="_blank">${data.reverse_source_url}</a>`;
                    }
                    document.getElementById('reverse-results').style.display = 'block';
                } else if (data.reverse_error) {
                    document.getElementById('reverse-status').innerText = `Reverse search error: ${data.reverse_error}`;
                    document.getElementById('reverse-results').style.display = 'block';
                } else {
                    document.getElementById('reverse-results').style.display = 'none';
                }

                resultDiv.style.display = 'block';
        }
    </script>
</html>
